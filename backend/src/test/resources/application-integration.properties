# Settings for integration tests only (activated with @ActiveProfiles("integration")).
# The database itself (URL, user, password) comes from the MySQL Testcontainer, see TestcontainersConfiguration.

# Create the tables from the entity classes at startup and drop them at shutdown.
spring.jpa.hibernate.ddl-auto=create-drop

# After Hibernate has created the tables, run our setup script (roles, column defaults).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/integration-setup.sql

# On a fresh database Hibernate first tries to drop tables that don't exist yet and logs warnings
# ("Table 'test.users' doesn't exist"). They are harmless, so hide them.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
